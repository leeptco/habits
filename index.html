<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Росток</title>
  <meta name="description" content="План дня, время на хобби и поиск работы">
  <meta name="theme-color" content="#0c0e18">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    // тема до отрисовки, чтобы не мигало
    try {
      var t = localStorage.getItem('rostok-theme') || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="haze" aria-hidden="true"></div>
  <header class="topbar" id="topbar"></header>
  <main id="screen"></main>
  <div id="timerBar" class="timer-bar hidden"></div>
  <div id="drawer" class="drawer hidden"></div>
  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toasts" class="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
